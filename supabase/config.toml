# Supabase Local Development Configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

# The track function is a public endpoint — badge.js sends unauthenticated
# requests from third-party partner sites. JWT verification must stay OFF.
[functions.track]
verify_jwt = false

[auth]
enabled = false  # Not using Supabase Auth for this project

[analytics]
enabled = false
